<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大厅 · 剩余电量监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2322d3ee' d='M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z'/></svg>">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--card:#131a2b;--card2:#1a2340;--border:#1e2a4a;
  --text:#e8edf7;--muted:#6b7a99;--accent:#22d3ee;--accent2:#0ea5e9;
  --down:#f472b6;
}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px 16px 60px;
}
.wrap{max-width:900px;margin:0 auto}

/* 顶部标题 */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.header h1 .live{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header .meta{font-size:12px;color:var(--muted)}

/* 日期切换 */
.datebar{
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;margin-bottom:16px;
}
.datebar button{
  background:var(--card2);border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.datebar button:hover{background:var(--accent2);border-color:var(--accent2)}
.datebar button:disabled{opacity:.3;cursor:not-allowed}
.datebar .date{font-size:16px;font-weight:600;min-width:160px;text-align:center}
.datebar .today{font-size:11px;background:var(--card2);color:var(--accent);padding:3px 10px;border-radius:10px;cursor:pointer;border:1px solid var(--border)}

/* 大数字卡片 */
.hero{
  background:linear-gradient(135deg,#0ea5e922 0%,#22d3ee11 50%,transparent 100%),var(--card);
  border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;
  background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);
  pointer-events:none;
}
.hero .label{font-size:13px;color:var(--muted);margin-bottom:8px}
.hero .value{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#22d3ee,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .unit{font-size:20px;font-weight:400;color:var(--muted);margin-left:6px;-webkit-text-fill-color:var(--muted)}
.hero .sub{display:flex;gap:24px;margin-top:16px;font-size:13px;color:var(--muted)}
.hero .sub b{color:var(--text);font-weight:500}

/* 图表 */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#chart{width:100%;height:300px}

/* 表格 */
.tw{max-height:320px;overflow-y:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card)}
td{font-variant-numeric:tabular-nums}
tr:hover td{background:var(--card2)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}

@media(max-width:640px){
  .hero .value{font-size:42px}
  .hero{padding:20px}
  .datebar .date{min-width:120px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1><span class="live"></span>大厅 · 剩余电量</h1>
    <div class="meta">表号 18501681136</div>
  </div>

  <div class="datebar">
    <button id="prev" onclick="shiftDate(-1)">‹</button>
    <div class="date" id="dateLabel">--</div>
    <button id="next" onclick="shiftDate(1)">›</button>
    <button class="today" onclick="goToday()">回到今天</button>
  </div>

  <div class="hero">
    <div class="label">最新剩余电量</div>
    <div><span class="value" id="curVal">--</span><span class="unit">kWh</span></div>
    <div class="sub">
      <span>最高 <b id="maxVal">--</b></span>
      <span>最低 <b id="minVal">--</b></span>
      <span>波动 <b id="diffVal">--</b></span>
      <span>记录 <b id="cntVal">--</b> 条</span>
    </div>
  </div>

  <div class="card">
    <h2>当日曲线 <span id="rangeVal"></span></h2>
    <div id="chart"></div>
  </div>

  <div class="card">
    <h2>当日明细</h2>
    <div class="tw">
      <table>
        <thead><tr><th>时间</th><th>剩余电量 (kWh)</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const BASE = 'data/';
let dates = [];
let curIdx = -1;
let chart = echarts.init(document.getElementById('chart'));

async function loadDates(){
  try{
    const r = await fetch(BASE+'index.json?_='+Date.now());
    dates = await r.json();
  }catch(e){ dates = []; }
  curIdx = dates.length-1;
  renderDateBar();
  if(curIdx>=0) loadDay(dates[curIdx]);
}

function renderDateBar(){
  const label = document.getElementById('dateLabel');
  if(curIdx<0){ label.textContent='暂无数据'; }
  else{
    const d = dates[curIdx];
    const today = new Date().toISOString().slice(0,10);
    label.textContent = d + (d===today?' (今天)':'');
  }
  document.getElementById('prev').disabled = curIdx<=0;
  document.getElementById('next').disabled = curIdx>=dates.length-1;
}

function shiftDir(dir){
  curIdx = Math.max(0, Math.min(dates.length-1, curIdx+dir));
  renderDateBar();
  loadDay(dates[curIdx]);
}
function goToday(){
  curIdx = dates.length-1;
  renderDateBar();
  loadDay(dates[curIdx]);
}

async function loadDay(dateStr){
  let records = [];
  try{
    const r = await fetch(BASE+dateStr+'.json?_='+Date.now());
    records = await r.json();
  }catch(e){ records = []; }

  const tb = document.getElementById('tbody');
  if(records.length===0){
    document.getElementById('curVal').textContent='--';
    document.getElementById('maxVal').textContent='--';
    document.getElementById('minVal').textContent='--';
    document.getElementById('diffVal').textContent='--';
    document.getElementById('cntVal').textContent='0';
    document.getElementById('rangeVal').textContent='';
    tb.innerHTML='<tr><td colspan="2" class="empty">当天暂无数据</td></tr>';
    chart.clear();
    return;
  }

  const vals = records.map(r=>r.v);
  const last = vals[vals.length-1];
  const max = Math.max(...vals);
  const min = Math.min(...vals);

  document.getElementById('curVal').textContent = last.toFixed(2);
  document.getElementById('maxVal').textContent = max.toFixed(2);
  document.getElementById('minVal').textContent = min.toFixed(2);
  document.getElementById('diffVal').textContent = (max-min).toFixed(2);
  document.getElementById('cntVal').textContent = records.length;
  document.getElementById('rangeVal').textContent = records[0].t + ' ~ ' + records[records.length-1].t;

  tb.innerHTML = records.slice().reverse().map(r=>
    `<tr><td>${r.t}</td><td>${r.v.toFixed(2)}</td></tr>`
  ).join('');

  chart.setOption({
    backgroundColor:'transparent',
    grid:{left:50,right:20,top:20,bottom:30},
    tooltip:{trigger:'axis',backgroundColor:'#131a2b',borderColor:'#1e2a4a',textStyle:{color:'#e8edf7'},
      formatter:p=>p[0].axisValue+'<br/>剩余电量: <b>'+p[0].data.toFixed(2)+'</b> kWh'},
    xAxis:{type:'category',data:records.map(r=>r.t),
      axisLabel:{color:'#6b7a99',fontSize:11},axisLine:{lineStyle:{color:'#1e2a4a'}},
      axisTick:{show:false}},
    yAxis:{type:'value',min:v=>Math.floor(v.min-0.5),
      axisLabel:{color:'#6b7a99',fontSize:11},splitLine:{lineStyle:{color:'#1e2a4a'}}},
    series:[{
      type:'line',data:vals,smooth:true,symbol:'circle',symbolSize:6,
      lineStyle:{color:'#22d3ee',width:2.5},
      itemStyle:{color:'#22d3ee',borderColor:'#0a0e1a',borderWidth:2},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0,color:'rgba(34,211,238,.35)'},
        {offset:1,color:'rgba(34,211,238,0)'}
      ])}
    }]
  },true);
}

window.addEventListener('resize',()=>chart.resize());
loadDates();
// 每30秒自动刷新当前页
setInterval(()=>{ if(curIdx>=0) loadDay(dates[curIdx]); }, 30000);
</script>
</body>
</html>
